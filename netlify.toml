[build]
  command = "npm run build"
  publish = "dist"

# Set CROPS=off to replace every Pearson crop with a link to the PDF.
[build.environment]
  NODE_VERSION = "22"
  CROPS = "on"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
